    from password disclosure - authorities may compel the former but not the latter. The quest: litigation
    and legislative clarity establishing that biometric unlock is protected speech under nemo tenetur.'
  status: identified
  category: society
  link: https://questhub.eco/quest/019e1c21-622f-70f3-9659-b2624ea20425/
  sources: [tana, questhub]
