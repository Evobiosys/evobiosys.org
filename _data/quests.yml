  sources: [tana, questhub]
- title: EvoBioSys-Style Augmented Intelligence
  description: 'AI tools designed to amplify collective intelligence rather than replace individual thinking
    - surfacing connections across conversations, mapping consensus and dissent, helping groups hold more
    complexity. Grounded in EvoBioSys principles: the system serves life, not efficiency metrics.'
  status: identified
  category: knowledge
