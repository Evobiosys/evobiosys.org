- title: Obsidian Canvas to Logseq Whiteboard Converter
  description: Obsidian Canvas and Logseq Whiteboard both let you arrange notes spatially, but in incompatible
    formats. An open converter with round-trip fidelity so you are not locked into one spatial thinking
    tool and can share visual knowledge maps across both ecosystems.
  status: identified
  category: tools
  link: https://questhub.eco/quest/019e1c23-3f52-7680-a511-74e5a24f0c76/
  sources: [tana, questhub]
- title: Making BrowserOS as Safe as Brave
  description: 'Brave has fingerprinting protection, aggressive tracker blocking, and a clean default
    config. The quest: bring the same security baseline to a browser-centric OS so privacy is a platform
    property, not an extension you have to install and configure yourself.'
  status: identified
  category: tech
  link: https://questhub.eco/quest/019e1c23-3de1-7510-a479-c63b20798aa4/
  sources: [tana, questhub]
- title: Used Phones Brand as Alternative to Fairphone
  description: A certified-refurbished phone brand that competes on sustainability by extending device
    lifespans rather than manufacturing new ones. Rigorous quality standards, privacy-by-default OS, and
    full transparency on provenance and repair history. Extends the life of existing hardware instead
    of mining for new.
  status: identified
  category: tech
  link: https://questhub.eco/quest/019e1c23-3c66-7ad2-bab5-b79a5def2809/
  sources: [tana, questhub]
- title: interHarness
  description: 'An internal EvoBioSys tool: a bridge between AI agents (Claude, Gemini) and the developer
    terminal - enabling Claude Code to send keyboard input, read terminal output, and interact with TUI
    applications in a running session. Built on the ACP protocol. Enables autonomous multi-step development
    workflows.'
  status: identified
  category: tools
  link: https://questhub.eco/quest/019e1c21-73df-71c1-9706-1abe41312c61/
  sources: [tana, questhub]
- title: Overlap with the Mycelial Net
  description: 'The mycelial network metaphor - distributed, resilient, nourishing - applied to knowledge
    infrastructure. The quest: map where existing regenerative knowledge commons already function like
    mycelium, identify the missing connective tissue, and build bridges between nodes that don''t yet
    know each other.'
  status: identified
  category: knowledge
